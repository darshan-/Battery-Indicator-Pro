buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

apply plugin: 'com.android.application'

Properties secureProperties = new Properties()
secureProperties.load(new FileInputStream("secure.properties"))

android {
    namespace "com.darshancomputing.BatteryIndicatorPro"

    compileSdk 33

    defaultConfig {
        minSdk 26
        targetSdk 33

        vectorDrawables {
            useSupportLibrary = false
        }

        resConfigs "ar", "cs", "de", "el", "en", "en-rUS", "es", "es-rUS", "fa", "fr", "hi", "hu", "it", "iw", "ja", "lt", "nl", "pl", "pt", "pt-rBR", "ro", "ru", "sk", "sl", "sr", "tr", "zh", "zh-rCN"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    signingConfigs {
        release {
            storeFile file("../private/my-release-key.keystore")
            storePassword secureProperties['key.store.password']
            keyAlias "alias_name"
            keyPassword secureProperties['key.alias.password']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFile 'proguard-no-obfuscation'
        }
    }

    lint {
        disable 'MissingTranslation'
    }
}

dependencies {
    // Many core libraries now need this; build fails without it
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.0"))

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.core:core:1.10.1"
    implementation "androidx.fragment:fragment:1.6.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.preference:preference:1.2.1"
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

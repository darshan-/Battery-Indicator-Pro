plugins {
    id 'com.android.application' version '9.4.0'
}

Properties secureProperties = new Properties()
secureProperties.load(new FileInputStream("secure.properties"))

android {
    namespace "com.darshancomputing.BatteryIndicatorPro"

    compileSdk 37

    defaultConfig {
        minSdk 26
        targetSdk 37

        vectorDrawables {
            useSupportLibrary = false
        }

        resConfigs "ar", "cs", "de", "el", "en", "en-rUS", "es", "es-rUS", "fa", "fr", "hi", "hu", "it", "iw", "ja", "lt", "nl", "pl", "pt", "pt-rBR", "ro", "ru", "sk", "sl", "sr", "tr", "zh", "zh-rCN"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file("../private/my-release-key.keystore")
            storePassword secureProperties['key.store.password']
            keyAlias "alias_name"
            keyPassword secureProperties['key.alias.password']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFile 'proguard-no-obfuscation'
        }
    }

    lint {
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.4.20"))

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.core:core:1.19.0"
    implementation "androidx.fragment:fragment:1.9.0"
    implementation "androidx.viewpager:viewpager:1.1.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.preference:preference:1.2.1"
}
